[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  GIT_LFS_ENABLED = "true"

[[redirects]]
  from = "/api/visitor-count"
  to = "/.netlify/functions/visitor-count"
  status = 200

[[redirects]]
  from = "/api/report-breach"
  to = "/.netlify/functions/log"
  status = 200

[[redirects]]
  from = "/api/roblox-avatar"
  to = "/.netlify/functions/roblox-avatar"
  status = 200

[[redirects]]
  from = "/api/steam-profile"
  to = "/.netlify/functions/steam-profile"
  status = 200
